[package]
name = "atuin-worker"
version = "0.1.0"
description = "A single-user Atuin sync server on Cloudflare Workers and D1"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
http = "=1.5.0"
bytes = "=1.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
hmac = "=0.13.0"
sha2 = "=0.11.1"
subtle = "=2.6.1"
base64 = "=0.23.1"
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "=0.8.7", features = ["http", "d1"] }
http-body-util = "=0.1.5"

[dev-dependencies]
# prepare() check of sql.rs only; 0.32 because atuin-client links the same libsqlite3-sys
rusqlite = { version = "0.32", features = ["bundled"] }
atuin-domain = { git = "https://github.com/atuinsh/atuin", tag = "v18.24.4" }
atuin-client = { git = "https://github.com/atuinsh/atuin", tag = "v18.24.4", default-features = false, features = [
    "sync",
] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4", "v7"] }
secrecy = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
