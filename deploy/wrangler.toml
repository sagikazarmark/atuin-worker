name = "atuin"
main = "build/index.js"
compatibility_date = "2026-11-01"

# Deploy source for the Deploy to Cloudflare button. Workers Builds has no Rust toolchain, so there
# is no [build] stanza: build/ is supplied prebuilt, and the build step lives in package.json.

[[d1_databases]]
binding        = "DB"
database_name  = "atuin"
migrations_dir = "migrations"
# no database_id: the button (or wrangler 4.45+ on first deploy) provisions it and writes the ID here

[vars]
MAX_RECORD_SIZE = "262144"   # 256 KiB; PAGE_SIZE × MAX_RECORD_SIZE must not exceed 40 MiB (D1 caps results at 50 MB)
PAGE_SIZE       = "100"

[[ratelimits]]
name         = "LOGIN_LIMIT"
namespace_id = "4710"        # unique per binding within the account; not the docs' example 1001
simple       = { limit = 5, period = 60 }

[observability]
enabled = true
