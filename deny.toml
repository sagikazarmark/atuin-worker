[graph]
all-features = true

[licenses]
# The crate itself is AGPL-3.0-only and never published; the allowlist below is
# a policy for third-party code only.
private = { ignore = true }
allow = [
  "Apache-2.0",
  "MIT",

  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "BSL-1.0", # xxhash-rust: the capability token
  "Zlib",    # foldhash, via the dev-only atuin-client
]

[advisories]
ignore = [
  # basic-toml is unmaintained; it reaches us only through the dev-only atuin crates.
  { id = "RUSTSEC-2026-0374", reason = "dev-dependency of atuin-common, not shipped" },
  # Bundled SQLite < 3.54.0 can leak page-cache memory when opening an untrusted
  # db + `-wal` pair; patched in libsqlite3-sys 0.39. It reaches us only through
  # the dev-only atuin crates (via sqlx) and our test-only rusqlite; the Worker
  # uses D1 and links no SQLite. `links = "sqlite3"` allows one version per graph
  # and sqlx-sqlite 0.9 caps it at <0.38, so it cannot be bumped until sqlx and
  # the pinned atuin tag move. Tests only open databases they create themselves.
  { id = "RUSTSEC-2026-0459", reason = "dev-only bundled SQLite, blocked by sqlx's <0.38 cap; not shipped" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The drift and end-to-end tests use upstream's own types and client at the pinned tag.
allow-git = ["https://github.com/atuinsh/atuin"]
